<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apply: Senior Architect AI Engineering and Platforms | MockDice</title>
<!-- MOCK PAGE for ApplyFlow tests and demos. Not a real Dice page. The wizard itself is
     mock-dice-wizard.cjs, the same script the jsdom tests use. -->
<style>
  :root { --ink:#18181b; --muted:#52525c; --line:#e4e4e7; --teal:#007595; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color:var(--ink); background:#fafafa; }
  .site-header { display:flex; align-items:center; gap:20px; height:56px; padding:0 24px; background:#fff; border-bottom:1px solid var(--line); }
  .site-header .logo { font-weight:800; font-size:13px; color:#fff; background:#5b6676; padding:4px 8px; border-radius:4px; text-decoration:none; }
  .site-header nav a { color:var(--ink); text-decoration:none; margin-right:16px; font-size:13px; }
  .site-header .search { margin-left:auto; display:flex; gap:6px; }
  .site-header .search input { border:1px solid var(--line); border-radius:999px; padding:6px 12px; font-size:13px; width:200px; }
  .site-header .search button { border:0; background:var(--teal); color:#fff; border-radius:999px; padding:6px 14px; font-weight:600; }
  .site-header.slim { justify-content:space-between; }
  .site-header .icons { display:flex; gap:14px; }
  .site-header .icons button { border:0; background:none; font-size:18px; cursor:pointer; }
  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .req { color:#c8102e; }
  .art { display:block; margin-bottom:6px; }
  .progress { height:14px; border-radius:999px; background:#e4e4e7; overflow:hidden; margin-top:18px; }
  .progress span { display:block; height:100%; background:var(--teal); border-radius:999px; }
  .lede { color:var(--ink); margin:0 0 14px; }
  .review-card { display:flex; justify-content:space-between; align-items:center; background:#fff; border-radius:10px; box-shadow:0 1px 4px rgba(0,0,0,.12); padding:16px 20px; margin-bottom:12px; }
  .review-card h3 { margin:0 0 8px; font-size:17px; }
  .review-card .value { margin:0; color:#52525c; }
  .round-edit { width:44px; height:44px; border-radius:50%; border:1.5px solid var(--teal); background:#fff; color:var(--teal); cursor:pointer; }
  .icon-button { margin-left:auto; border:1px solid var(--line); background:#fff; border-radius:999px; padding:4px 10px; cursor:pointer; }
  .portal-menu { position:absolute; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:0 6px 20px rgba(24,24,27,.12); min-width:160px; z-index:5; }
  .portal-menu [role=menuitem] { padding:9px 16px; cursor:pointer; }
  .portal-menu [role=menuitem]:hover { background:#f4f4f5; }
  .page { max-width:760px; margin:24px auto; padding:0 20px; }
  .wizard-shell { background:#fff; border:1px solid var(--line); border-radius:16px; padding:24px 28px; box-shadow:0 1px 3px rgba(24,24,27,.06); }
  .eyebrow { margin:0; color:var(--muted); font-size:13px; }
  .wizard-head h1 { font-size:22px; margin:2px 0 0; }
  .company { margin:2px 0 0; color:var(--muted); }
  .steps { margin:14px 0 6px; font-size:13px; color:var(--muted); font-weight:600; }
  .content h2 { font-size:18px; margin:6px 0 14px; }
  .doc-section { margin-bottom:18px; }
  .doc-section h3 { font-size:14px; margin:0 0 6px; }
  .file-card { position:relative; display:flex; align-items:center; gap:12px; border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .file-card .file-link, .file-card .file-name { color:var(--teal); font-weight:600; text-decoration:none; }
  .file-card .meta { color:var(--muted); font-size:12px; }
  .file-card .kebab, .file-card .remove { margin-left:auto; border:1px solid var(--line); background:#fff; border-radius:999px; padding:4px 10px; cursor:pointer; }
  .menu { position:absolute; right:12px; top:48px; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:0 6px 20px rgba(24,24,27,.12); display:grid; z-index:2; }
  .menu[hidden] { display:none; }
  .menu button { border:0; background:none; text-align:left; padding:8px 16px; cursor:pointer; }
  .dropzone { border:1.5px dashed #a5e4f1; background:#ecfeff; border-radius:12px; padding:16px; text-align:center; color:var(--muted); }
  .dropzone p { margin:2px 0; }
  .dropzone .browse { border:1px solid var(--teal); color:var(--teal); background:#fff; border-radius:999px; padding:4px 14px; font-weight:600; cursor:pointer; }
  .q { margin-bottom:14px; }
  .q p, .q label[for] { display:block; font-weight:600; margin:0 0 6px; }
  .q [role=radiogroup] label { margin-right:16px; }
  .q input[type=text], .q select { border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-size:14px; min-width:220px; }
  .error { background:#fef2f2; color:#c10007; border:1px solid #fbc4c4; border-radius:8px; padding:8px 12px; margin-bottom:12px; }
  .review { display:grid; grid-template-columns:160px 1fr; gap:6px 12px; }
  .review dt { color:var(--muted); }
  .review dd { margin:0; font-weight:600; }
  .wizard-nav { display:flex; justify-content:space-between; border-top:1px solid var(--line); margin-top:18px; padding-top:16px; }
  .wizard-nav button { border-radius:999px; padding:8px 26px; font-weight:600; cursor:pointer; font-size:14px; }
  .btn-back { border:1px solid var(--line); background:#fff; }
  .btn-next, .btn-submit { border:0; background:var(--teal); color:#fff; }
  .done { text-align:center; padding:30px 0; }
  .site-footer { max-width:760px; margin:24px auto; padding:0 20px; display:flex; gap:16px; font-size:12px; }
  .site-footer a { color:var(--muted); text-decoration:none; }
</style>
<script src="/__mock/mock-dice-wizard.js"></script>
</head>
<body>
<script>mountDiceWizard(document, { title: 'Senior Architect AI Engineering and Platforms', company: 'Meridian Credit Analytics LLC', location: 'Chicago, IL', header: 'slim', steps: 3 });</script>
</body>
</html>
